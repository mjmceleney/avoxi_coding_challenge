apiVersion: v1
kind: Namespace
metadata:
  name: geoip-api

---
apiVersion: v1
kind: Secret
metadata:
  name: maxmind-credentials
  namespace: geoip-api
type: Opaque
stringData:
  account-id: "YOUR_ACCOUNT_ID"
  license-key: "YOUR_LICENSE_KEY"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoip-api
  namespace: geoip-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: geoip-api
  template:
    metadata:
      labels:
        app: geoip-api
    spec:
      # Must cover the app's preStop pause (5s) plus its shutdown drain (10s).
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: geoipupdate
          image: ghcr.io/maxmind/geoipupdate:v8.0.0
          restartPolicy: Always
          env:
            - name: GEOIPUPDATE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: maxmind-credentials
                  key: account-id
            - name: GEOIPUPDATE_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: maxmind-credentials
                  key: license-key
            - name: GEOIPUPDATE_EDITION_IDS
              value: GeoLite2-Country
            # Must stay non-zero: at 0 geoipupdate downloads once and exits, and Kubernetes
            # restarts an exited native sidecar, so it would download over and over.
            - name: GEOIPUPDATE_FREQUENCY
              value: "24"
          startupProbe:
            exec:
              command: ["test", "-f", "/usr/share/GeoIP/GeoLite2-Country.mmdb"]
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: geoip
              mountPath: /usr/share/GeoIP
      containers:
        - name: app
          image: YOUR_REGISTRY/geoip-api:TAG
          imagePullPolicy: IfNotPresent
          # Bypass the image's entrypoint (which runs geoipupdate itself); the sidecar above
          # keeps the database fresh.
          command: ["/app"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          env:
            - name: DB_PATH
              value: /usr/share/GeoIP/GeoLite2-Country.mmdb
            - name: ADDR
              value: ":8080"
            - name: GRPC_ADDR
              value: ":9090"
          lifecycle:
            # Kubernetes removes a terminating pod from the Service endpoints at the same
            # time as it sends SIGTERM, and other nodes take a moment to notice. Pausing
            # before SIGTERM keeps the pod serving the requests still routed to it; the
            # app then drains in-flight requests as it shuts down.
            preStop:
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: geoip
              mountPath: /usr/share/GeoIP
              readOnly: true
      volumes:
        - name: geoip
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: geoip-api
  namespace: geoip-api
spec:
  type: ClusterIP
  selector:
    app: geoip-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
