version: v2
managed:
  enabled: false
plugins:
  # Plugin versions are pinned to match google.golang.org/protobuf and google.golang.org/grpc
  # in go.mod; bump them together.
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: gen
    opt: paths=source_relative
